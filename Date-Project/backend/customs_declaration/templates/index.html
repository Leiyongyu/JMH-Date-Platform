<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>报关单生成系统</title>
<link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<style>
body { background: #e8ecf1; font-family: 'Microsoft YaHei','SimSun',sans-serif; overflow-x: auto; overflow-y: auto; height: 100vh; margin: 0; }
.toolbar { background: #fff; border-bottom: 2px solid #dee2e6; padding: 10px 0; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 4px rgba(0,0,0,.08); }
.form-table { border-collapse: collapse; background: #fff; margin: 0 auto; font-size: 12px; }
.form-table td { border: 1px solid #000; padding: 3px 5px; vertical-align: middle; }
.form-table .label { background: #f5f5f5; text-align: center; font-weight: bold; white-space: nowrap; font-size: 11px; width:1%; }
.form-table input, .form-table textarea { border: none; outline: none; width: 100%; background: transparent; font-size: 11px; font-family: inherit; resize: none; padding: 2px; }
.form-table input:focus, .form-table textarea:focus { background: #fffde7; }
.title-row td { text-align: center; font-size: 15px; font-weight: bold; padding: 7px; }
.data-row td { height: 26px; font-size: 11px; }
.data-row td input { text-align: center; font-size: 10px; }
.badge-sku { font-family: Consolas,monospace; font-size: 10px; color: #1a73e8; }
.search-dropdown { position: absolute; z-index: 1000; width: 280px; max-height: 260px; overflow-y: auto;
    background: #fff; border: 1px solid #1a73e8; border-radius: 0 0 6px 6px; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
.search-item { padding: 6px 10px; cursor: pointer; border-bottom: 1px solid #eee; font-size: 12px; }
.search-item:hover, .search-item.active { background: #e8f0fe; }
.search-item .sku { font-family: Consolas,monospace; color: #1a73e8; font-size: 11px; }
#loadingOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(255,255,255,.7); z-index: 9999; justify-content: center; align-items: center; }
.toast-container { position: fixed; top: 20px; right: 20px; z-index: 10000; }
</style>
</head>
<body>

<div id="loadingOverlay"><div class="spinner-border text-primary" style="width:3rem;height:3rem"></div></div>
<div class="toast-container" id="toastContainer"></div>

<!-- 工具栏：单排 -->
<div class="toolbar">
    <div class="container-fluid" style="max-width:1400px">
        <div class="row align-items-center g-2">
            <div class="col-auto" style="font-weight:700;font-size:14px;color:#1a3a5c">
                报关单生成系统
            </div>
            <div class="col-auto">
                <input type="file" id="importFile" accept=".xlsx,.xls" onchange="importExcel(this)" hidden multiple>
                <button class="btn btn-success btn-sm" onclick="document.getElementById('importFile').click()"><i class="bi bi-upload me-1"></i>导入存库</button>
            </div>
            <div class="col-auto">
                <input type="file" id="batchSkuFile" accept=".xlsx,.xls" onchange="batchImportSkus(this)" hidden>
                <button class="btn btn-success btn-sm" onclick="document.getElementById('batchSkuFile').click()"><i class="bi bi-search me-1"></i>批量查询</button>
            </div>
            <div class="col-auto">
                <button class="btn btn-success btn-sm" onclick="exportExcel()"><i class="bi bi-download me-1"></i>导出Excel</button>
            </div>
            <div class="col-auto">
                <button class="btn btn-outline-danger btn-sm" onclick="clearAll()"><i class="bi bi-trash me-1"></i>清空</button>
            </div>
        </div>
    </div>
</div>

<!-- 报关单表单 -->
<div class="container-fluid" style="max-width:1400px; padding: 16px 10px; overflow-x: auto;">
<table class="form-table" style="width:100%;min-width:1000px;table-layout:fixed" id="mainForm">

<colgroup>
<col style="width:35px"><col style="width:80px"><col style="width:65px">
<col style="width:170px"><col style="width:55px"><col style="width:90px">
<col style="width:105px"><col style="width:50px"><col style="width:50px">
<col style="width:60px"><col style="width:45px"><col style="width:46px">
</colgroup>

<tr class="title-row"><td colspan="12">中华人民共和国海关出口货物报关单</td></tr>

<tr>
<td class="label">预录入编号：</td><td colspan="2"><input id="f_pre_entry"></td>
<td class="label" colspan="2">海关编号：</td><td colspan="4"><input id="f_customs_no"></td>
<td class="label">页码/页数</td><td colspan="2"><input></td>
</tr>

<tr>
<td class="label">境内发货人</td>
<td colspan="2"><textarea rows="2" id="f_consignor">成都玖马赫供应链管理有限公司   信用代码：91510106MACMNJMB6A</textarea></td>
<td class="label" colspan="2">出境关别</td><td><input id="f_customs_area"></td>
<td class="label">出口日期</td><td><input id="f_export_date"></td>
<td class="label">申报日期</td><td><input id="f_declare_date"></td>
<td class="label">备案号</td><td><input id="f_record_no"></td>
</tr>

<tr>
<td class="label">境外收货人</td>
<td colspan="2"><textarea rows="2" id="f_consignee">Hong Kong Cammy Yeson Limited</textarea></td>
<td class="label" colspan="2">运输方式</td><td><input id="f_transport_mode"></td>
<td class="label">运输工具名称及航次号</td><td><input id="f_transport_name"></td>
<td class="label" colspan="2">提运单号</td><td colspan="2"><input id="f_bill_no"></td>
</tr>

<tr>
<td class="label">生产销售单位</td>
<td colspan="2"><textarea rows="2" id="f_producer">成都玖马赫供应链管理有限公司   信用代码：91510106MACMNJMB6A</textarea></td>
<td class="label">监管方式</td><td><input id="f_supervision" value="一般贸易"></td>
<td class="label">征免性质</td><td><input id="f_tax_nature" value="一般征税"></td>
<td class="label">许可证号</td><td colspan="4"><input id="f_license_no"></td>
</tr>

<tr>
<td class="label">合同协议号</td><td colspan="2"><input id="f_contract_no"></td>
<td class="label">贸易国（地区）</td><td><input id="f_trade_country" value="美国"></td>
<td class="label">运抵国（地区）</td><td><input id="f_dest_country" value="美国"></td>
<td class="label">指运港</td><td colspan="2"><input id="f_dest_port"></td>
<td class="label">离境口岸</td><td><input id="f_entry_port"></td>
</tr>

<tr>
<td class="label">包装种类</td><td><input id="f_pack_type" value="纸箱"></td>
<td class="label">件数</td><td><input id="f_pack_qty" class="auto-calc"></td>
<td class="label">毛重（千克）</td><td><input id="f_gross_wt"></td>
<td class="label">净重（千克）</td><td><input id="f_net_wt"></td>
<td class="label">成交方式</td><td><input id="f_trade_term" value="FOB"></td>
</tr>

<tr>
<td class="label">运费</td><td colspan="2"><input id="f_freight"></td>
<td class="label">保费</td><td colspan="2"><input id="f_insurance"></td>
<td class="label">杂费</td><td colspan="5"><input id="f_other_fee"></td>
</tr>

<tr>
<td class="label">随附单证及编号</td><td colspan="11"><input id="f_docs" value="合同、发票、装箱单等，收货人信息提示：Hong Kong Cammy Yeson Limited"></td>
</tr>

<tr><td class="label">标记唛码及备注</td><td colspan="11"><textarea rows="2" id="f_marks"></textarea></td></tr>

<!-- 表头：列宽由上方 <colgroup> 控制 -->
<tr style="background:#f5f5f5;font-weight:bold;text-align:center">
<td>项号</td>
<td>商品编码</td>
<td>商品名称</td>
<td>SKU（以下信息必须填写在申报要素备注栏）</td>
<td>规格型号</td>
<td>数量及单位</td>
<td>单价/总价/币制</td>
<td>原产国（地区</td>
<td>最终目的国（地区</td>
<td>境内货源地</td>
<td>征免</td>
<td>操作</td>
</tr>

<tbody id="dataRows"></tbody>

</table>
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
