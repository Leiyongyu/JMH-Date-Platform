<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="renderer" content="webkit">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0B3D93">
  <meta name="description" content="JMH 跨境 ERP — 订单、库存、利润一体化运营工作台">
  <meta name="apple-mobile-web-app-title" content="JMH 跨境ERP">

  <!-- 图标：SVG 优先（清晰、支持暗色适配），PNG / ICO 兜底 -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="alternate icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <title>%VITE_APP_TITLE%</title>
  <!--[if lt IE 11]><script>window.location.href='/html/ie.html';</script><![endif]-->
  <style>
    html,
    body,
    #app {
      height: 100%;
      margin: 0px;
      padding: 0px;
    }

    /* ---------- 启动画面：品牌渐变 + 标识 + 细进度条 ---------- */
    #loader-wrapper {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      /* 与登录页左栏采用同一套品牌斜向渐变，切换时不跳色 */
      background:
        radial-gradient(90% 70% at 0% 100%, rgba(18, 178, 166, 0.28), transparent 60%),
        linear-gradient(133deg, #061630 0%, #0a2a5e 40%, #0b4a80 70%, #0d7a86 100%);
      -webkit-font-smoothing: antialiased;
    }

    #loader-mark {
      width: 56px;
      height: 56px;
      opacity: 0;
      transform: translateY(6px);
      animation: loader-rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.05s forwards;
    }

    #loader-bar {
      position: relative;
      width: 132px;
      height: 2px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.16);
      overflow: hidden;
      opacity: 0;
      animation: loader-fade 0.5s ease 0.18s forwards;
    }

    #loader-bar::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 44%;
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0), #fff);
      animation: loader-slide 1.15s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }

    .load_title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.62);
      opacity: 0;
      animation: loader-fade 0.5s ease 0.26s forwards;
    }

    @keyframes loader-rise {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes loader-fade {
      to {
        opacity: 1;
      }
    }

    @keyframes loader-slide {
      0% {
        left: -46%;
      }

      100% {
        left: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #loader-mark,
      #loader-bar,
      .load_title {
        animation-duration: 0.01s;
        opacity: 1;
        transform: none;
      }

      #loader-bar::after {
        animation: none;
        left: 0;
        width: 100%;
        background: rgba(255, 255, 255, 0.5);
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="loader-wrapper">
      <svg id="loader-mark" viewBox="0 0 24 24" aria-hidden="true">
        <defs>
          <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity=".95" />
            <stop offset="1" stop-color="#fff" stop-opacity=".7" />
          </linearGradient>
        </defs>
        <rect x="0.6" y="0.6" width="22.8" height="22.8" rx="6" fill="none" stroke="url(#lg)"
          stroke-width="1.2" stroke-opacity=".55" />
        <path d="M14.9 5.8 L14.9 13.2 C14.9 16.6 12.8 18.5 10.1 18.5 C7.7 18.5 6.1 17.1 5.6 15.2"
          fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <div id="loader-bar"></div>
      <div class="load_title">正在加载工作台</div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
